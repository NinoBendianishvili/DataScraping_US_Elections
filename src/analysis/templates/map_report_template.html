<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Results Maps by Year</title>
    <!-- The Plotly JS library is included directly in the first map div by the Python script -->
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; line-height: 1.6; color: #333; max-width: 1200px; margin: 0 auto; padding: 20px; background-color: #f8f9fa; }
        h1, h2 { color: #0056b3; border-bottom: 2px solid #dee2e6; padding-bottom: 10px; text-align: center; }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(550px, 1fr)); gap: 20px; }
        .plot-container { background-color: #fff; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); padding: 15px; }
    </style>
</head>
<body>
    <header>
        <h1>U.S. Presidential Election Analysis</h1>
    </header>
    <main>
        <h2>Election Results by Year</h2>
        <div class="container">
            {% for year in years_sorted %}
                {% if year in map_divs %}
                    <div class="plot-container">
                        {{ map_divs[year]|safe }}
                    </div>
                {% endif %}
            {% else %}
                <p>No election maps available to display.</p>
            {% endfor %}
        </div>
    </main>
</body>
</html>
